name: message-scheduler-demo

x-app: &app
  build:
    context: .
    target: release
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  mem_limit: 256m
  cpus: 0.50
  volumes:
    - scheduler-data:/data
  networks: [offline]
  environment: &environment
    MESSAGE_PROVIDER: demo
    SCHEDULER_DB: /data/scheduler.db
    SCHEDULER_AUTH: /data/auth.json
    LATE_TOLERANCE_SECONDS: ${LATE_TOLERANCE_SECONDS:-900}
    MAX_SENDS_PER_HOUR: ${MAX_SENDS_PER_HOUR:-30}

services:
  api:
    <<: *app
    environment:
      <<: *environment
      SCHEDULER_ADMIN_USER: ${SCHEDULER_ADMIN_USER:-admin}
      SCHEDULER_ADMIN_PASSWORD: ${SCHEDULER_ADMIN_PASSWORD:?Run python3 scripts/setup.py first}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  worker:
    <<: *app
    command: [python, -m, scheduler.worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,time; c=sqlite3.connect('file:/data/scheduler.db?mode=ro',uri=True); r=c.execute(\"SELECT value FROM runtime WHERE key='heartbeat'\").fetchone(); assert r and time.time()-float(r[0])<30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: nginx:1.29-alpine
    user: "10001:10001"
    entrypoint: [nginx]
    command: [-c, /etc/nginx/nginx.conf, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./proxy.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${SCHEDULER_PORT:-8080}:8080"
    networks: [offline, ingress]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  scheduler-data:

networks:
  offline:
    internal: true
  ingress:
