name: Demo validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: scheduler-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Privacy and all Git objects
        run: |
          python scripts/privacy_check.py --all-objects
          git fsck --full --no-reflogs
      - name: Gitleaks working files and full history
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact=100 --no-banner
      - name: Dependency audits
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend audit --audit-level=low
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
      - name: Offline unit and safety tests
        run: |
          docker build --target test -t scheduler-tests .
          docker run --rm --network none scheduler-tests
      - name: Isolated installation
        run: |
          python scripts/setup.py
          docker compose up -d --build --wait
          python scripts/verify_artifacts.py --image scheduler-test-api
          npx --prefix frontend playwright install --with-deps chromium
      - name: Worker, restart, recovery and browser checks
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          values = dict(line.split('=', 1) for line in pathlib.Path('.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          env = os.environ | {'DEMO_PASSWORD': values['SCHEDULER_ADMIN_PASSWORD']}
          subprocess.run([sys.executable, 'tests/docker_smoke.py'], env=env, check=True)
          subprocess.run(['npm', '--prefix', 'frontend', 'run', 'test:e2e'], env=env, check=True)
          PY
      - name: Tear down isolated test services
        if: always()
        run: docker compose down -v --remove-orphans
